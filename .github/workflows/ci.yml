# The tests, on every push and every pull request.
#
# They call no model and touch no network: the gate's verdicts, the source
# audit, the registry's shelf lives and the graph's shape are all decided in
# plain code, which is what makes them worth running on every commit. Whether
# the reviewers still catch anything is a separate question, measured with
# `python -m app.cli eval` against a real model — not from here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest tests/unit tests/integration -q

      # Advisory: this bare ruff config is stricter than the one the project
      # lints with, so it reports findings that predate this workflow.
      - name: Lint
        run: uv run --with ruff ruff check app tests
        continue-on-error: true
