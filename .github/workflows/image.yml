# Build the image here, so the server never has to.
#
# A daily-article pipeline runs on the smallest machine that will hold it, and
# `docker build` is by far the heaviest thing that would ever happen there —
# heavier than a run. So the image is built on GitHub and the server pulls it.
#
# The tests run first. An image that ships a failing gate is worse than no
# image, because it publishes.

name: image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Architectures to build for (uname -m on the server: x86_64 is amd64, aarch64 is arm64)"
        default: linux/amd64
        type: string
      tag_as_latest:
        description: "Also publish this build as :latest — for deploying a branch before it is merged"
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  # Not ${{ github.repository }}: image names must be lowercase and the
  # repository name is not.
  IMAGE_NAME: ai-content-writer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest tests/unit tests/integration -q

      # Advisory: this bare ruff config is stricter than the one the project
      # lints with, so it reports findings that predate this workflow. Failing
      # the build on them would mean no image ever ships.
      - name: Lint
        run: uv run --with ruff ruff check app tests
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Every build is addressable by commit, so a rollback is a tag away.
          # `latest` follows main, unless a dispatch asks for it explicitly.
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || inputs.tag_as_latest == true }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AGENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What to pull
        run: |
          echo "### Image published" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >>"$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          echo "On the server: \`sudo ./deploy/install.sh\`" >>"$GITHUB_STEP_SUMMARY"
